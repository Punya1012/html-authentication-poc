<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4" style="width: 350px;">
    <h3 class="text-center mb-3">Register</h3>

    <form onsubmit="alert('Registered Successfully')">
        <input type="text" class="form-control mb-2" placeholder="Name" required>
        <input type="email" class="form-control mb-2" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>

        <button class="btn btn-custom w-100">Register</button>
    </form>

    <div class="text-center mt-3">
        <a href="login.html">Back to Login</a>
    </div>
</div>

</body>
</html>
