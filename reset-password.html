<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 text-center" style="width: 350px;">
    <h4 class="mb-3">Reset Password</h4>

    <form onsubmit="alert('Password Updated')">
        <input type="password" class="form-control mb-2" placeholder="New Password" required>
        <input type="password" class="form-control mb-3" placeholder="Confirm Password" required>

        <button class="btn btn-custom w-100">Update Password</button>
    </form>
</div>

</body>
</html>
