<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 text-center" style="width: 350px;">
    <h4 class="mb-3">Forgot Password</h4>

    <form onsubmit="alert('Reset link sent!')">
        <input type="email" class="form-control mb-3" placeholder="Enter Email" required>

        <button class="btn btn-custom w-100">Send Reset Link</button>
    </form>

    <a href="login.html" class="mt-3 d-block">Back to Login</a>
</div>

</body>
</html>
